<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <header class="header">
        <h1 class="title" > 러브 이탈리아 </h1>
        <p> 이탈리아의 매력적인 도시들을 알아보세요 </p>
    </header>


    <main class="main">
        <section>
            <form class="inputbox">
                <input type="text" placeholder="도시 이름을 입력하세요">
                <button type="submit">검색</button>   
                <p hidden class="nocity"> 아직 등록되지 않았거나 존재하지 않는 도시입니다. </p>  
            </form>
        </section>

        <hr>

        <section class="city_list">
            <div> 
                <img src="https://www.civitatis.com/blog/wp-content/uploads/2024/10/roma3-scaled.jpg" alt="로마">
                <h3 class="cityname"> 로마 </h3>
            </div>

            <div>
               <img src="https://tourismmedia.italia.it/is/image/mitur/20220314122814-firenze-toscana-gettyimages-479035945?wid=1080&hei=660&fit=constrain,1&fmt=webp" alt="피렌체">
                <h3 class="cityname"> 피렌체 </h3>
             </div>

            <div>
                <img src="https://www.itabus.it/on/demandware.static/-/Sites-ITABUS-Library/default/dw5dcf13c2/Destinazioni/Lombardia/Milano/Duomo.jpg" alt="밀라노">
                <h3 class="cityname"> 밀라노</h3>
            </div>
        </section>
        <script src="script.js"></script>
    </main>
    <aside>  



    </aside>

    
</body>
</html>
